<!DOCTYPE html>
<html>
    <head>
<title>My Food Menu</title>
<style>
body {
font-family:'Times New Roman', Times, serif;
background: greenyellow;
padding: 30px;
text-align: left;
}

h1 {color: light orangered; }

/* Sibling Selector - styles the paragraph right after h1 */
h1 + p {
background: purple;
padding: 15px 30px;
border-radius: 12px;
color: lightsalmon;
display: inline-block;
}
ul { padding: 0; margin-top: 25px; }

/* Child Selector - styles only direct li children of ul */
ul > li {
list-style: none;
font-size: 18px;
font-weight: bold;
color: turquoise;
padding: 10px zepx;
margin: 6px auto;
width: 260px;
background: ghost blanchedalmond;
border-radius: 8px;
}

/* nth-child - highlights the 3rd item as Chef's Special */
ul li:nth-child(3) {
background: #ffe082;
color: le65c00;
}
.desc {
color: #599;
margin-top: 20px;
font-size: 15px;
Max-width: 400px;
margin-left: auto;
Margin-right: auto;
}


/* first-letter - makes the first letter big and bold */
.desc :: first.letter {
font-size: 220%;
color: te65c00;
font-weight: bold;
}

links { margin-top: 25px; }

/* Hover Effect - links glow when mouse moves over then */
a {
color: goldenrod;
text-decoration: none;
font-size: 15px;
margin: 0 12px;
padding: 8px 18px;
border: 2px solid darkorchid;
border-radius: 8px;
}
a:hover {
background: #e65c00;
color: white;
}

</style>
</head>
<body>
 <h1>MY FOOD MENU</h1>
 <p>Pick your favourite dish and dig in !</p>

<ul>
<li>Pizza</li>
<li>Burger</li>
<li>Tacos - Chef's Speciall</li>
<li>Noodles</li>
<li>Ice Cream</li>
</ul>

<p class="desc">Every dish on this menu is made with love and
loads of flavour. ty them all and find your favourite !</p>

<div class-"links">
<a href="Order Now </a>
</div>
</BODY>
</HTML>
