<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <h2>javascript array Methods</h2>
        <h2>join()method join array elements in the string and pop method removes the last element</h2>
        <p id="join"></p>
        <p id="firstpop"></p>
        <p id="secondpop"></p>
        <script>
            var fruits =["papaya","mango","jackfruit","grapes"]
            document.getElementById("join").innerHTML=fruits.join(" * ")
            document.getElementById("firstpop").innerHTML=fruits;
            fruits.pop();
            document.getElementById("secondpop").innerHTML=fruits

        </script>

    
    </body>
</html>
