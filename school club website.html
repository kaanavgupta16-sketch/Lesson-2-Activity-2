<!DOCTYPE html>
<html>
<head>
  <title>School Club Website</title>
  <link rel="stylesheet"
    href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body {
      background-color: lime;
      font-family: 'Courier New', Courier, monospace;
    }
    h3 {
      text-align: left;
      color: rgb(255, 1, 128);
    }
    .card {
      text-align: center;
      border: 2px solid goldenrod;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background-color: #c8a636;
    }
    h2 {
        text-align: center;
    }
  </style>
</head>
<body>

  <h2>My School Clubs</h2>

    <div class="row">


      <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
          <h3>sport Club</h3>
          <p>I learn how to play games and enjoy.</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card">
          <h3>Math Club</h3>
          <p>I enjoy doing calculations and solve problems.</p>
        </div>
      </div>

      <div class="col-12 col-md-12 col-lg-4">
        <div class="card">
          <h3>Computer Club</h3>
          <p>I learn basics of codind powerpoint and word</p>
        </div>
      </div>

    </div>
  </div>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
  </script>

</body>
</html>
