<!DOCTYPE html>

<head>
  <title>My Study Progress Dashboard</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body { background-color: turquoise;}
    .jumbotron { background-color: #274bce; border-left: 6px solid #FF5A43; }

    .section-title { color: #FF5A43; margin-top: 30px; margin-bottom: 15px; }
    p { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>

  <!-- TOPIC 1: JUMBOTRON -->
  <div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1>My Study Progress Dashboard</h1>
     look at your projects, lessons, and study materials in one place.
      <!-- TOPIC 2: BUTTONS -->
      <button class="btn btn-primary">Chemistry</button>
      <button class="btn btn-success">Science</button>
      <button class="btn btn-warning">maths</button>
      <button class="btn btn-danger">Coding</button>
    </div>
  </div>

  <div class="container">
    <h2 class="section-title">Lessons Completed  <class="badge bg-danger">24</h2>
    <p chemistry  class="badge badge-primary">12 lessons</p>
    <p Science  class="badge badge-success">17 lessons</p>
    <p maths  class="badge badge-warning">15 lessons</p>
    <p Coding  class="badge badge-info">15 lessons</p>

    <p>Math</p>
    <div class="progress mb-1">
      <div class="progress-bar bg-success" style="width: 97%">97%</div>
    </div>

    <p>Science</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-primary" style="width: 93%">93%</div>
    </div>

    <p>English</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-warning" style="width: 96%">96%</div>
    </div>

    <p>Coding</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-danger" style="width: 89%">89%</div>
    </div>

  </div>


</body>
</html>
